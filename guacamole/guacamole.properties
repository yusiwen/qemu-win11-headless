# Guacamole application properties.
# Mounted into the container at /etc/guacamole/guacamole.properties
# (the official image sets GUACAMOLE_HOME=/etc/guacamole).
#
# api-session-timeout — how many minutes an authentication token stays valid
# DESPITE INACTIVITY. Default is 60, which is what logs the browser out while
# you are doing something else in another tab: the JS client only extends the
# token on activity, so an idle tab expires and you land back on the login page
# (the open RDP tunnel dies with it).
#
# 720 = 12 hours. Tune to taste; smaller is safer if the web UI is reachable
# from an untrusted network.
api-session-timeout: 720

# ── Header authentication (SSO from a reverse proxy) ─────────────────────────
#
# Only takes effect when the header-auth extension is loaded, which the image
# does when HTTP_AUTH_ENABLED=true (compose reads HEADER_AUTH from .env).
#
# Which request header carries the authenticated username. The extension
# default is REMOTE_USER, and that default is a trap: header names with an
# underscore are not carried verbatim by every hop. Measured here, direct to
# the webapp REMOTE_USER works (200 + token), but the same request through
# Caddy returned 403 - Go canonicalises REMOTE_USER to Remote_user on the way
# through. A dashed name is passed through untouched by nginx, Caddy and
# Envoy, so use one.
http-auth-header: X-Guac-User
