# Guacamole web gateway in front of the win11 QEMU VM on this host.
#
#   browser --HTTP:8081--> guacamole(Tomcat) --> guacd:4822 --RDP-->
#           host.docker.internal:13389 (QEMU hostfwd) --> guest 10.0.2.15:3389
#
# Three containers, the official upstream layout. The VM itself is untouched:
# no agent, no registry change, no extra port inside Windows.
name: win11-guac

services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: win11-guacd
    restart: unless-stopped
    # guacd is the component that actually opens the RDP socket, so it is the
    # one that must resolve the host. host-gateway => 172.17.0.1 (docker0),
    # which is reachable because the QEMU hostfwd listens on 0.0.0.0:13389.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published on loopback only, purely so bin/guac-probe.py can drive guacd
    # from the host and prove the RDP leg end-to-end without a browser.
    ports:
      - "127.0.0.1:4822:4822"
    volumes:
      # Backend for RDP drive redirection. The connection's drive-path must name
      # a directory *inside this container*; without drive-path the drive is
      # never created even though enable-drive=true (measured: the guest showed
      # only C:/D:/E: and \\tsclient did not resolve).
      #
      # guacd runs as uid 1000 here, so this host directory must be writable by
      # 1000:1000. Files uploaded from the browser land here and appear in the
      # guest as \\tsclient\<drive-name>.
      - ./drive:/drive
    networks: [guacnet]

  postgres:
    image: postgres:16-alpine
    container_name: win11-guac-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing from .env}
    volumes:
      - ./db:/var/lib/postgresql/data
      # Runs once, only when ./db is empty. Generated by `make initdb`.
      - ./initdb.sql:/docker-entrypoint-initdb.d/01-initdb.sql:ro
    networks: [guacnet]

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: win11-guacamole
    restart: unless-stopped
    depends_on: [guacd, postgres]
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      # HTTP header auth (SSO). When HEADER_AUTH=true the image links
      # guacamole-auth-header.jar into GUACAMOLE_HOME/extensions, and Guacamole
      # logs in whoever the reverse proxy names in the REMOTE_USER header -
      # no login form, the proxy's own auth (Authelia/oauth2-proxy/etc.) is the
      # only interactive gate. Explicitly "false" keeps it loaded-but-disabled;
      # the mere presence of an HTTP_AUTH_* variable is what would enable it.
      #
      # SECURITY: this trusts a header. Only enable it when the webapp cannot be
      # reached except through that proxy (loopback bind, ssh tunnel, or a
      # firewall rule) - otherwise anyone can send the header and skip auth.
      HTTP_AUTH_ENABLED: "${HEADER_AUTH:-false}"
    volumes:
      # Session/token lifetime. GUACAMOLE_HOME is /etc/guacamole in this image,
      # so a read-only mount of one file is enough; nothing else is overridden.
      - ./guacamole.properties:/etc/guacamole/guacamole.properties:ro
    ports:
      - "${WEB_PORT:-8081}:8080"
    networks: [guacnet]

networks:
  guacnet:
    driver: bridge
