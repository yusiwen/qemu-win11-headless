# OPTIONAL TLS front for the Guacamole web UI - NOT part of the normal deployment.
#
# The normal path is: browser --HTTPS--> external nginx (Authelia) --> this LAN
# --> http://nuc12:8081/guacamole/. TLS is terminated at the front proxy, so the
# LAN hop is plain HTTP on purpose: it is inside the house, and the browser's
# secure context (which the clipboard needs) comes from the front proxy's
# certificate, not from here.
#
# Enable this overlay only if you want to reach Guacamole *directly* from a
# browser on the LAN. Then HTTPS is not cosmetic: the browser's Clipboard API
# only exists in a secure context, and Guacamole's clipboard dies silently over
# plain HTTP (measured: isSecureContext false, navigator.clipboard undefined).
#
# Enable:
#   1. in .env set:  WEB_PORT=127.0.0.1:8081      (web UI stops being LAN-visible)
#   2. docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#   3. browse https://192.168.2.48:8443/guacamole/
#
# The certificate is Caddy's internal CA (see Caddyfile). Browsers warn until
# you trust it:   scp the root cert, then import it.
#   docker exec win11-guac-tls cat /data/caddy/pki/authorities/local/root.crt #     > caddy-local-root.crt
services:
  caddy:
    image: caddy:2-alpine
    container_name: win11-guac-tls
    restart: unless-stopped
    depends_on: [guacamole]
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    networks: [guacnet]
