# Optional TLS front for the Guacamole web UI.
#
# Rationale: with plain HTTP the Windows password is typed into the browser and
# travels in cleartext across the LAN. This overlay puts Caddy in front, so the
# browser leg is HTTPS while guacd still speaks RDP to the QEMU hostfwd.
#
# Enable:
#   1. in .env set:  WEB_PORT=127.0.0.1:8081      (web UI stops being LAN-visible)
#   2. docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#   3. browse https://192.168.2.48:8443/guacamole/
#
# The certificate is Caddy's internal CA (see Caddyfile). Browsers warn until
# you trust it:   scp the root cert, then import it.
#   docker exec win11-guac-tls cat /data/caddy/pki/authorities/local/root.crt #     > caddy-local-root.crt
services:
  caddy:
    image: caddy:2-alpine
    container_name: win11-guac-tls
    restart: unless-stopped
    depends_on: [guacamole]
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
    networks: [guacnet]
